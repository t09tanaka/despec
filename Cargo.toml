[package]
name = "despec"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Deterministic design token generation and source policy checks"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
globset = "0.4"
walkdir = "2"
tempfile = "3"

[dev-dependencies]

[profile.release]
lto = true
strip = true
