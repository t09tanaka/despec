name: Release binaries
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir dist
          tar -czf dist/despec-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release despec -C "$GITHUB_WORKSPACE" LICENSE README.md
          cd dist
          shasum -a 256 *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: despec-${{ matrix.target }}
          path: dist/*
